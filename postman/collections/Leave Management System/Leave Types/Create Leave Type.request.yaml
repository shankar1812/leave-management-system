$kind: http-request
name: Create Leave Type
method: POST
url: '{{baseUrl}}/api/v1/leave-types'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Annual Leave",
      "maxDaysPerYear": 20,
      "isCarryForwardAllowed": true
    }
